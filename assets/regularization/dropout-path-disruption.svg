<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" rx="28" fill="#f8fafc"/>
  <text x="70" y="70" font-family="Inter, Arial" font-size="25" font-weight="700" fill="#111827">Dropout disrupts fixed feature paths</text>
  <text x="70" y="100" font-family="Inter, Arial" font-size="15" fill="#6b7280">a shortcut that works on the training set is randomly broken during training</text>

  <rect x="65" y="135" width="395" height="310" rx="22" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="520" y="135" width="395" height="310" rx="22" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="190" y="170" font-family="Inter, Arial" font-size="18" font-weight="700" fill="#374151">fixed path</text>
  <text x="630" y="170" font-family="Inter, Arial" font-size="18" font-weight="700" fill="#374151">after dropout</text>

  <!-- left network edges -->
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="140" y1="250" x2="260" y2="210"/><line x1="140" y1="250" x2="260" y2="300"/>
    <line x1="260" y1="210" x2="380" y2="250"/><line x1="260" y1="300" x2="380" y2="250"/>
  </g>
  <polyline points="140,250 260,210 380,250" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Arial" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="140" cy="250" r="28" fill="#fff8e1" stroke="#ff9800" stroke-width="3"/><text x="140" y="256" fill="#333">A</text>
    <circle cx="260" cy="210" r="28" fill="#fce4ec" stroke="#ef5350" stroke-width="3"/><text x="260" y="216" fill="#333">B</text>
    <circle cx="260" cy="300" r="28" fill="#f0f4ff" stroke="#5b8def" stroke-width="3"/><text x="260" y="306" fill="#333">D</text>
    <circle cx="380" cy="250" r="28" fill="#e8f5e9" stroke="#4caf50" stroke-width="3"/><text x="380" y="256" fill="#333">C</text>
  </g>
  <text x="158" y="365" font-family="Inter, Arial" font-size="15" fill="#6b7280">shortcut keeps lowering train loss</text>

  <!-- right network edges -->
  <g stroke="#cbd5e1" stroke-width="3">
    <line x1="595" y1="250" x2="715" y2="210"/><line x1="595" y1="250" x2="715" y2="300"/>
    <line x1="715" y1="210" x2="835" y2="250"/><line x1="715" y1="300" x2="835" y2="250"/>
  </g>
  <line x1="595" y1="250" x2="715" y2="210" stroke="#ef4444" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <line x1="715" y1="210" x2="835" y2="250" stroke="#ef4444" stroke-width="7" stroke-linecap="round" opacity="0.25" stroke-dasharray="10 10"/>
  <g font-family="Inter, Arial" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="595" cy="250" r="28" fill="#fff8e1" stroke="#ff9800" stroke-width="3"/><text x="595" y="256" fill="#333">A</text>
    <circle cx="715" cy="210" r="28" fill="#e5e7eb" stroke="#9ca3af" stroke-width="3"/><text x="715" y="216" fill="#6b7280">B</text>
    <line x1="695" y1="190" x2="735" y2="230" stroke="#6b7280" stroke-width="4"/><line x1="735" y1="190" x2="695" y2="230" stroke="#6b7280" stroke-width="4"/>
    <circle cx="715" cy="300" r="28" fill="#f0f4ff" stroke="#5b8def" stroke-width="3"/><text x="715" y="306" fill="#333">D</text>
    <circle cx="835" cy="250" r="28" fill="#e8f5e9" stroke="#4caf50" stroke-width="3"/><text x="835" y="256" fill="#333">C</text>
  </g>
  <text x="610" y="365" font-family="Inter, Arial" font-size="15" fill="#6b7280">fixed path is no longer reliable</text>
</svg>