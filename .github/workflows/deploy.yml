name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: posts

      - name: Copy posts to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/
          echo "=== Copied posts ==="
          ls -la source/source/_posts/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Build & Deploy
        run: |
          node -e "
          const Hexo = require('hexo');
          const hexo = new Hexo(process.cwd(), {silent: false});
          (async () => {
            await hexo.init();
            await hexo.load();
            await hexo.call('clean');
            await hexo.call('generate');
            await hexo.call('deploy');
            await hexo.exit();
          })().catch(e => { console.error(e); process.exit(1); });
          "
        working-directory: source
        env:
          HEXO_DEPLOYER_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
