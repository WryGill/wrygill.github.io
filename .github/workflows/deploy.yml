name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: |
            posts
            assets

      - name: Copy posts to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/
          echo "=== Copied posts ==="
          ls -la source/source/_posts/

      - name: Copy assets to source
        run: |
          if [ -d content/assets ]; then
            mkdir -p source/source/assets
            rm -rf source/source/assets/*
            cp -r content/assets/* source/source/assets/
            echo "=== Copied assets ==="
            find source/source/assets -type f
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install
          npm uninstall hexo-theme-butterfly 2>/dev/null || true
        working-directory: source

      - name: Clean & Generate
        run: |
          node -e "
            const Hexo = require('hexo');
            const hexo = new Hexo(process.cwd(), { silent: false });
            hexo.init()
              .then(() => {
                console.log('model(Post):', hexo.model('Post').length);
                console.log('locals posts:', hexo.locals.get('posts').length);
                return hexo.call('generate');
              })
              .then(() => console.log('Generate done'))
              .catch(e => { console.error('INIT ERROR:', e.message); process.exit(1); });
          "
        working-directory: source

      - name: Deploy to master
        run: |
          node -e "
            const Hexo = require('hexo');
            const hexo = new Hexo(process.cwd(), { silent: false });
            hexo.init()
              .then(() => hexo.call('deploy', { force: true }))
              .then(() => console.log('Deploy done'))
              .catch(e => { console.error(e); process.exit(1); });
          "
        working-directory: source
        env:
          HEXO_DEPLOYER_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
