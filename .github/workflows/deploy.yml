name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: |
            posts

      - name: Copy posts to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/
          echo "=== Copied posts ==="
          ls -la source/source/_posts/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Generate static files
        working-directory: source
        run: |
          node -e "
          const Hexo = require('hexo');
          const hexo = new Hexo(process.cwd(), { silent: false });
          hexo.env.init = true;
          hexo.init()
            .then(() => hexo.load())
            .then(() => hexo.call('clean'))
            .then(() => hexo.call('generate'))
            .then(() => { console.log('Generate done'); return hexo.exit(); })
            .catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify output
        working-directory: source
        run: |
          echo "public/ contents:"
          ls -la public/
          echo "---"
          echo "index.html size:"
          wc -c public/index.html 2>/dev/null || echo "NO INDEX.HTML"

      - name: Deploy to master
        working-directory: source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd public
          git init
          git add -A
          git commit -m "Site updated: $(date -u '+%Y-%m-%d %H:%M:%S')"
          git remote add origin "https://oauth2:${TOKEN}@github.com/WryGill/wrygill.github.io.git"
          git push --force origin master
