name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: |
            posts
            assets

      - name: Copy posts to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/
          echo "=== Copied posts ==="
          ls -la source/source/_posts/

      - name: Copy assets to source
        run: |
          if [ -d content/assets ]; then
            mkdir -p source/source/assets
            rm -rf source/source/assets/*
            cp -r content/assets/* source/source/assets/
            echo "=== Copied assets ==="
            find source/source/assets -type f
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Build
        working-directory: source
        run: |
          node -e "
            const Hexo = require('hexo');
            const hexo = new Hexo(process.cwd(), { silent: false });
            // 关键修复：env.init 必须设为 true，否则外部插件（含 markdown 渲染器）不会被加载
            hexo.env.init = true;
            hexo.init()
              .then(() => hexo.load())
              .then(() => hexo.call('generate'))
              .then(() => { console.log('Generate done'); return hexo.exit(); })
              .catch(e => { console.error(e); process.exit(1); });
          "

      - name: Deploy
        working-directory: source
        env:
          HEXO_DEPLOYER_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 使用 extraheader 让 git push 自动带上 token 认证，避免交互式输入密码
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:$HEXO_DEPLOYER_GIT_TOKEN" | base64 -w0)"
          node -e "
            const Hexo = require('hexo');
            const hexo = new Hexo(process.cwd(), { silent: false });
            hexo.env.init = true;
            hexo.init()
              .then(() => hexo.load())
              .then(() => hexo.call('deploy', { force: true }))
              .then(() => { console.log('Deploy done'); return hexo.exit(); })
              .catch(e => { console.error(e); process.exit(1); });
          "
