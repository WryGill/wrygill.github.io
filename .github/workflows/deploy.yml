name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: |
            posts
            assets

      - name: Copy posts and assets to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/
          if [ -d content/assets ]; then
            rm -rf source/source/assets
            cp -r content/assets source/source/assets
          fi
          echo "=== Copied posts ==="
          ls -la source/source/_posts/
          echo "=== Copied assets ==="
          ls -la source/source/assets/ 2>/dev/null || echo "(none)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Build & Deploy
        working-directory: source
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
          const Hexo = require('hexo');
          const hexo = new Hexo(process.cwd(), { silent: false });
          hexo.env.init = true;
          hexo.init()
            .then(() => hexo.load())
            .then(() => hexo.call('clean'))
            .then(() => hexo.call('generate'))
            .then(() => {
              console.log('Generate done, public/ files:');
              const fs = require('fs');
              const files = fs.readdirSync('public').filter(f => f.endsWith('.html'));
              files.slice(0,3).forEach(f => {
                const size = fs.statSync('public/' + f).size;
                console.log('  ' + f + ': ' + size + ' bytes');
              });
              return hexo.exit();
            })
            .catch(e => { console.error('Error:', e.message); process.exit(1); });
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd public && git init && git add -A
          git commit -m "Site updated: $(date -u '+%Y-%m-%d %H:%M:%S')"
          git remote add origin "https://oauth2:${TOKEN}@github.com/WryGill/wrygill.github.io.git"
          git push --force origin master