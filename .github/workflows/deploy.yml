name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: |
            posts

      - name: Copy posts to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Build
        working-directory: source
        run: |
          node -e "
          const Hexo = require('hexo');
          const hexo = new Hexo(process.cwd(), { silent: false });
          hexo.env.init = true;
          hexo.init()
            .then(() => hexo.load())
            .then(() => hexo.call('generate'))
            .then(() => {
              console.log('Generate done');
              const fs = require('fs');
              const files = fs.readdirSync('public').filter(f => f.endsWith('.html'));
              console.log('public/ files:', files.length);
              return hexo.exit();
            })
            .catch(e => { console.error('Build error:', e.message); process.exit(1); });
          "

      - name: Deploy
        working-directory: source
        run: |
          node -e "
          const Hexo = require('hexo');
          const hexo = new Hexo(process.cwd(), { silent: false });
          hexo.env.init = true;
          hexo.init()
            .then(() => hexo.load())
            .then(() => hexo.call('deploy', { force: true }))
            .then(() => {
              console.log('Deploy done');
              return hexo.exit();
            })
            .catch(e => { console.error('Deploy error:', e.message); process.exit(1); });
          "