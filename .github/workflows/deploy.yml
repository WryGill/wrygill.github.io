name: Hexo Deploy

on:
  push:
    branches:
      - content
      - source
  workflow_dispatch:

concurrency:
  group: hexo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hexo source
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: source
          path: source
          submodules: true

      - name: Checkout blog posts
        uses: actions/checkout@v4
        with:
          repository: WryGill/wrygill.github.io
          ref: content
          path: content
          sparse-checkout: |
            posts
            assets

      - name: Copy posts to source
        run: |
          mkdir -p source/source/_posts
          rm -rf source/source/_posts/*
          cp -r content/posts/*.md source/source/_posts/
          echo "=== Copied posts ==="
          ls -la source/source/_posts/

      - name: Copy assets to source
        run: |
          if [ -d content/assets ]; then
            mkdir -p source/source/assets
            rm -rf source/source/assets/*
            cp -r content/assets/* source/source/assets/
            echo "=== Copied assets ==="
            find source/source/assets -type f
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: source

      - name: Debug hexo env
        run: |
          echo "=== node version ==="
          node --version
          echo "=== hexo binary ==="
          ls -la node_modules/.bin/hexo 2>/dev/null || echo "no hexo binary"
          echo "=== hexo package ==="
          ls node_modules/hexo/package.json 2>/dev/null && node -e "console.log(require('hexo/package.json').version)" || echo "no hexo package"
          echo "=== hexo-cli version ==="
          node -e "try{console.log(require('hexo-cli/package.json').version)}catch(e){console.log('no hexo-cli')}" 2>/dev/null
          echo "=== try hexo version ==="
          ./node_modules/.bin/hexo version 2>/dev/null || true
        working-directory: source

      - name: Build
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const glob = require('glob');
            const Hexo = require('hexo');
            const cwd = process.cwd();
            console.log('CWD:', cwd);
            console.log('=== recursive listing of cwd/source/ ===');
            function listDir(dir, depth) {
              if (depth > 3) return;
              try {
                fs.readdirSync(dir, {withFileTypes: true}).forEach(d => {
                  const indent = '  '.repeat(depth);
                  if (d.isDirectory()) {
                    console.log(indent + d.name + '/');
                    if (d.name !== 'node_modules' && d.name !== '.git')
                      listDir(dir + '/' + d.name, depth + 1);
                  } else {
                    console.log(indent + d.name);
                  }
                });
              } catch(e) { console.log('  [ERR]', dir, e.message); }
            }
            listDir(cwd + '/source', 0);
            console.log('=== glob scan ===');
            try {
              const files = glob.sync('**/*', { cwd: cwd + '/source', dot: false, nodir: true, ignore: ['node_modules/**'] });
              console.log('Files found:', files.length);
              files.slice(0, 20).forEach(f => console.log('  ', f));
            } catch(e) { console.log('ERROR:', e.message); }

            const hexo = new Hexo(cwd, { silent: false });
            hexo.init()
              .then(() => {
                console.log('=== Box inspect ===');
                console.log('Box methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(hexo.source)).join(', '));
                console.log('Box base:', hexo.source.base);
                console.log('source_dir:', hexo.source_dir);
                return hexo.load();
              })
              .then(() => {
                console.log('Posts:', hexo.model('Post').length);
                console.log('Pages:', hexo.model('Page').length);
                console.log('All models:', Object.keys(hexo.model._models || {}));
                return hexo.call('generate');
              })
              .then(() => { console.log('Generate done'); return hexo.exit(); })
              .catch(e => { console.error('ERROR:', e.message); process.exit(1); });
          "
        working-directory: source

      - name: Deploy
        run: |
          node -e "
            const Hexo = require('hexo');
            const hexo = new Hexo(process.cwd(), { silent: false });
            hexo.init()
              .then(() => hexo.load())
              .then(() => hexo.call('deploy', { force: true }))
              .then(() => { console.log('Deploy done'); return hexo.exit(); })
              .catch(e => { console.error(e); process.exit(1); });
          "
        working-directory: source
        env:
          HEXO_DEPLOYER_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
